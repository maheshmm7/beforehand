<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="mask-icon" href="/favicon.svg" color="#E09A2B" />
    <meta name="theme-color" content="#FBF9F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15140F" media="(prefers-color-scheme: dark)" />
    <title>Beforehand — know what a decision costs before you make it</title>
    <meta
      name="description"
      content="A planning assistant for weddings, birthdays and community events. Change one thing and see every cost, deadline and task it moves — before you commit."
    />
    <style>
      /* The splash is inline so a refresh paints the mark immediately, with no
         script and no network round trip. React replaces it on mount. */
      :root {
        --splash-bg: #fbf9f4;
        --splash-ink: #15140f;
        --splash-accent: #e09a2b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --splash-bg: #15140f;
          --splash-ink: #f2eee4;
        }
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--splash-bg);
      }
      #root {
        min-height: 100svh;
      }
      .splash {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        color: var(--splash-ink);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      .splash svg {
        width: 72px;
        height: 72px;
      }
      .splash-word {
        font-size: 0.9375rem;
        letter-spacing: 0.14em;
        text-transform: lowercase;
        opacity: 0.55;
      }
      .splash-arc {
        opacity: 0;
        transform-box: view-box;
        transform-origin: 8.5px 16px;
        animation: splash-out 1800ms cubic-bezier(0.22, 0.61, 0.36, 1) infinite;
      }
      .splash-arc-2 {
        animation-delay: 220ms;
      }
      .splash-arc-3 {
        animation-delay: 440ms;
      }
      @keyframes splash-out {
        0% {
          opacity: 0;
          transform: scale(0.72);
        }
        35% {
          opacity: 0.9;
        }
        100% {
          opacity: 0;
          transform: scale(1.12);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-arc {
          animation: none;
          opacity: 0.55;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-live="polite">
        <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <circle cx="8.5" cy="16" r="3.2" fill="var(--splash-accent)" />
          <g
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
            class="splash-arcs"
          >
            <path class="splash-arc splash-arc-1" d="M13.12 10.09 A7.5 7.5 0 0 1 13.12 21.91" />
            <path class="splash-arc splash-arc-2" d="M15.89 6.54 A12 12 0 0 1 15.89 25.46" />
            <path class="splash-arc splash-arc-3" d="M18.66 3 A16.5 16.5 0 0 1 18.66 29" />
          </g>
        </svg>
        <p class="splash-word">beforehand</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
