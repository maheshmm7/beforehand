version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    # Majors are not proposed automatically. The one that was broke the
    # install outright: ESLint 10 against a plugin whose peer range stops at
    # 9, so npm could not resolve the tree and every build on that branch
    # failed. A major needs a person to check what still supports it.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'deps'
    groups:
      types:
        patterns: ['@types/*']
      testing:
        patterns: ['vitest', '@vitest/*', '@playwright/*', '@testing-library/*', 'jsdom']
      linting:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', 'eslint-plugin-*', 'prettier']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
