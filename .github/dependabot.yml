version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: 'deps'
    groups:
      types:
        patterns: ['@types/*']
      testing:
        patterns: ['vitest', '@vitest/*', '@playwright/*', '@testing-library/*', 'jsdom']
      linting:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', 'eslint-plugin-*', 'prettier']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
